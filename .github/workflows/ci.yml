name: CI

on:
  push:
    branches: [ main, feat-initial-commit ]
  pull_request:
    branches: [ main, feat-initial-commit ]

env:
  TF_VERSION: '1.6.0'
  TFLINT_VERSION: '0.50.3'
  TF_SECURITY_VERSION: '1.0.3'

jobs:
  terraform-validate:
    name: 'Terraform Validate'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [
          'cloudwatch-basic',
          's3-basic',
          'advanced-configuration',
          'complete-infrastructure'
        ]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Format Check
      run: terraform fmt -check -recursive

    - name: Terraform Init
      run: |
        cd examples/${{ matrix.example }}
        terraform init -backend=false

    - name: Terraform Validate
      run: |
        cd examples/${{ matrix.example }}
        terraform validate

    - name: Terraform Plan
      run: |
        cd examples/${{ matrix.example }}
        terraform plan -var="aws_region=ca-central-1" -out=tfplan

  terraform-lint:
    name: 'Terraform Lint'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Install TFLint
      run: |
        curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
        sudo mv tflint /usr/local/bin/

    - name: TFLint Init
      run: |
        cd examples/cloudwatch-basic
        terraform init -backend=false
        tflint --init

    - name: TFLint
      run: |
        tflint --recursive

  security-scan:
    name: 'Security Scan'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Install tfsecurity
      run: |
        curl -L "https://github.com/aquasecurity/tfsecurity/releases/download/v${{ env.TF_SECURITY_VERSION }}/tfsecurity_${{ env.TF_SECURITY_VERSION }}_linux_amd64.tar.gz" | tar -xz
        sudo mv tfsecurity /usr/local/bin/

    - name: Run tfsecurity
      run: |
        tfsecurity . --format sarif --out tfsecurity-results.sarif

    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: tfsecurity-results.sarif

  markdown-lint:
    name: 'Markdown Lint'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install markdownlint
      run: npm install -g markdownlint-cli

    - name: Run markdownlint
      run: markdownlint "**/*.md" --ignore node_modules
